# ==========================================================================
# 绿链锂电采购平台 - 一键部署编排

services:
  # ======================== 基础中间件 ========================
  # 所有密码均支持 .env 文件覆盖（与 docker-compose.yml 同目录）：
  #   MYSQL_ROOT_PASSWORD / NEO4J_PASSWORD / REDIS_PASSWORD / MINIO_ROOT_PASSWORD
  # 未设置时使用下方默认值（仅本地演示/开发用，生产环境请务必使用强密码 + .env）

  mysql:
    image: mysql:8.0
    container_name: gc-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: "green_chain"
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      # 启动时自动执行 SQL 初始化脚本（如果有 schema-missing.sql 放在项目根目录）
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/sql/product_seed.sql:/docker-entrypoint-initdb.d/02-product-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD:-123456} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: gc-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt Driver（Spring Boot 连这个）
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-12345678}
      NEO4J_apoc_import_file_enabled: "true"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/import
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD:-12345678}\" \"RETURN 1;\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    container_name: gc-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ======================== 后端 Spring Boot ========================

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # BuildKit 缓存配置：让 /root/.m2 Maven 仓库持久化到 Docker 缓存存储
      # 第一次构建会下载依赖（慢约 3-5 分钟），之后直接复用缓存（秒级）
      cache_from:
        - user:maven-cache
      cache_to:
        - user:maven-cache:mode=max
    container_name: gc-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 用 Spring Boot 标准环境变量覆盖 application.yml 中的连接地址
    # （docker-compose 内部通过服务名互连，外部 localhost 也能访问）
    environment:
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/green_chain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      # Redis
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # Neo4j
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: "12345678"
      # MinIO（内部互连用服务名）
      MINIO_ENDPOINT: http://minio:9000
      # 文件存储：生产建议用 MinIO，这里先兼容本地磁盘
      UPLOAD_LOCAL_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # minio 可选，不阻塞后端启动
    networks:
      - gc-net

  # ======================== 前端 Nginx ========================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gc-net

volumes:
  mysql-data:
  redis-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  minio-data:
  uploads-data:

networks:
  gc-net:
    driver: bridge
