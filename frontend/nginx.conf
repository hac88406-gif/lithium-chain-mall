# ==========================================================================
# Nginx 配置：托管 Vue 3 静态文件 + 反代后端 API + SPA fallback
# ==========================================================================

upstream backend {
    # docker-compose 内后端服务名就是 backend，端口 8080
    server backend:8080;
}

server {
    listen       80;
    server_name  localhost;

    # ---------------- 反代后端 API ----------------
    # 前端 dev 环境 vite.config.js 里配了 /api 和 /uploads 代理到 localhost:8080
    # 生产环境 nginx 里做同样的代理，指向 docker-compose 的 backend 服务
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 超时和缓冲配置（和 Spring Boot 默认对齐）
        proxy_read_timeout     60s;
        proxy_connect_timeout  10s;
        proxy_buffering        on;
        proxy_buffer_size      8k;
    }

    # 本地上传的图片（MinioUtil 落本地磁盘，WebMvcConfig 映射 /uploads/**）
    location /uploads/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # Knife4j 接口文档（直接反代，不走前端）
    location /doc.html {
        proxy_pass http://backend;
    }
    location /webjars/ {
        proxy_pass http://backend;
    }
    location /v3/api-docs/ {
        proxy_pass http://backend;
    }
    location /swagger-resources/ {
        proxy_pass http://backend;
    }

    # ---------------- 静态文件：Vue 3 打包产物 ----------------
    root   /usr/share/nginx/html;
    index  index.html;

    # 精确匹配优先 → 无扩展名文件不尝试再匹配（加快静态资源访问）
    location ~* \.(?:ico|css|js|gif|jpe?g|png|ttf|woff2?|svg|map|glb)$ {
        expires    7d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---------------- SPA fallback ----------------
    # 任何不匹配的路径都返回 index.html，让 Vue Router 处理
    # （支持 hash 模式 /#/xxx 和 history 模式 /xxx 都没问题）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------- 错误页 ----------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
